server.port=8080

# ---- 边缘网关配置（edge.gateway.*）----
# 本地缓冲目录（spool.log / dedup.idx / checkpoint 均在其下）
edge.gateway.data-dir=data/edge-gateway
# 有界缓冲容量（未确认上报的最大条数）
edge.gateway.buffer-capacity=10000
# 追加写获取内部锁的最长等待(ms)，超时以 WRITE_CONGESTION 背压拒绝，避免阻塞采集主流程
edge.gateway.write-lock-timeout-millis=50
# 业务时间戳允许的未来偏移(ms)，超出按 TIMESTAMP_OUT_OF_RANGE 拒绝
edge.gateway.max-future-skew-millis=300000
# 后台续传轮询间隔(ms)
edge.gateway.relay-interval-millis=200
